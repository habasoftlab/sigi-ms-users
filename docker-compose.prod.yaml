version: '3.8'
services:
  ms-users:
    build: .
    image: sigi-ms-users:latest
    container_name: sigi-ms-users-prod
    ports:
      - "172.17.0.1:8090:8090"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/sigi
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - APP_PORT=8090
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always